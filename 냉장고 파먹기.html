<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>냉장고 파먹기</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts Inter & Noto Sans KR -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            color: #f8fafc;
            min-height: 100vh;
        }

        /* Metallic Fridge Texture Effects */
        .metal-finish {
            background: linear-gradient(145deg, #cbd5e1 0%, #94a3b8 50%, #64748b 100%);
            box-shadow: inset 0 1px 1px rgba(255,255,255,0.8), 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }

        .metal-door-left {
            background: linear-gradient(90deg, #e2e8f0 0%, #cbd5e1 70%, #94a3b8 100%);
            border-right: 3px solid #475569;
        }

        .metal-door-right {
            background: linear-gradient(90deg, #94a3b8 0%, #cbd5e1 30%, #f1f5f9 100%);
            border-left: 3px solid #475569;
        }

        .fridge-handle {
            background: linear-gradient(180deg, #f8fafc 0%, #64748b 50%, #334155 100%);
            box-shadow: 2px 2px 5px rgba(0,0,0,0.4);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }

        /* Trash Animation Effect */
        @keyframes throwToTrash {
            0% { transform: scale(1) translate(0, 0) rotate(0deg); opacity: 1; }
            50% { transform: scale(0.5) translate(150px, 200px) rotate(180deg); opacity: 0.8; }
            100% { transform: scale(0.1) translate(300px, 400px) rotate(360deg); opacity: 0; }
        }

        .trash-animation {
            animation: throwToTrash 0.7s forwards ease-in-out;
        }

        /* LED Display Pulse */
        .led-glow {
            text-shadow: 0 0 8px rgba(56, 189, 248, 0.8);
        }
    </style>
</head>
<body class="p-2 sm:p-4 md:p-6 min-h-screen flex flex-col justify-between">

    <div class="max-w-7xl mx-auto w-full flex-grow flex flex-col">
        <!-- Top Title Bar & LED Smart Display -->
        <header class="mb-4 bg-slate-900/90 backdrop-blur-md rounded-2xl p-4 border border-slate-700 shadow-2xl flex flex-wrap justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <div class="w-12 h-12 rounded-xl bg-gradient-to-tr from-cyan-500 to-blue-600 flex items-center justify-center text-2xl shadow-lg">
                    ❄️
                </div>
                <div>
                    <h1 class="text-xl sm:text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 to-blue-300">
                        냉장고 파먹기
                    </h1>
                    <p class="text-xs text-slate-400">있는 재료로 만드는 맞춤 레시피 가이드</p>
                </div>
            </div>

            <!-- LED Controller Interface -->
            <div class="flex items-center space-x-4 bg-slate-950 px-4 py-2 rounded-xl border border-cyan-500/30 text-cyan-400 text-xs sm:text-sm font-mono shadow-inner">
                <div class="text-center">
                    <span class="block text-[10px] text-slate-500">냉장실</span>
                    <span class="font-bold text-base led-glow">3℃</span>
                </div>
                <div class="h-6 w-px bg-slate-800"></div>
                <div class="text-center">
                    <span class="block text-[10px] text-slate-500">냉동실</span>
                    <span class="font-bold text-base led-glow">-18℃</span>
                </div>
                <div class="h-6 w-px bg-slate-800"></div>
                <div class="text-center">
                    <span class="block text-[10px] text-slate-500">등록 식재료</span>
                    <span id="stat-count" class="font-bold text-base text-emerald-400 led-glow">0개</span>
                </div>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 flex-grow">
            
            <!-- LEFT PANEL: Premium Metal Fridge (5 Cols) -->
            <div class="lg:col-span-5 flex flex-col">
                <div class="metal-finish rounded-3xl p-4 sm:p-5 flex-grow flex flex-col border border-slate-400 shadow-2xl relative overflow-hidden">
                    
                    <!-- Fridge Header & Add Button -->
                    <div class="flex justify-between items-center mb-4 bg-slate-800/80 p-3 rounded-2xl border border-slate-600">
                        <span class="text-sm font-semibold text-slate-200 flex items-center gap-2">
                            <span class="inline-block text-cyan-400">🚪</span> 보관 중인 식재료
                        </span>
                        <button onclick="openAddModal()" class="px-3 py-1.5 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white rounded-xl text-xs font-bold transition shadow-lg flex items-center gap-1 active:scale-95">
                            <span class="inline-block ">➕</span> 재료 추가
                        </button>
                    </div>

                    <!-- Internal Fridge Shelves Container -->
                    <div class="space-y-4 flex-grow overflow-y-auto pr-1 max-h-[650px]">
                        
                        <!-- Shelf 1: Fresh Cold Room (상단 냉장실) -->
                        <div class="bg-slate-900/80 rounded-2xl p-3 border-b-4 border-slate-700 relative shadow-inner">
                            <div class="text-[11px] font-bold text-cyan-300 uppercase tracking-wider mb-2 flex justify-between items-center">
                                <span><span class="inline-block mr-1">🌡️</span> 상단 냉장실 (Fresh Cold)</span>
                                <span id="count-fridge-top" class="text-slate-400 text-[10px]">0개</span>
                            </div>
                            <div id="shelf-fridge-top" class="grid grid-cols-2 sm:grid-cols-3 gap-2 min-h-[90px] p-1">
                                <!-- Dynamic Render -->
                            </div>
                        </div>

                        <!-- Shelf 2: Vegetable & Fresh Box (신선 야채실) -->
                        <div class="bg-slate-900/80 rounded-2xl p-3 border-b-4 border-slate-700 relative shadow-inner">
                            <div class="text-[11px] font-bold text-emerald-300 uppercase tracking-wider mb-2 flex justify-between items-center">
                                <span><span class="inline-block mr-1">🥕</span> 신선 야채/신선실</span>
                                <span id="count-fridge-veg" class="text-slate-400 text-[10px]">0개</span>
                            </div>
                            <div id="shelf-fridge-veg" class="grid grid-cols-2 sm:grid-cols-3 gap-2 min-h-[90px] p-1">
                                <!-- Dynamic Render -->
                            </div>
                        </div>

                        <!-- Shelf 3: Freezer (하단 냉동실) -->
                        <div class="bg-slate-950/90 rounded-2xl p-3 border-b-4 border-blue-900 relative shadow-inner">
                            <div class="text-[11px] font-bold text-blue-300 uppercase tracking-wider mb-2 flex justify-between items-center">
                                <span><span class="inline-block mr-1">❄️</span> 하단 냉동실 (Freezer)</span>
                                <span id="count-fridge-freezer" class="text-slate-400 text-[10px]">0개</span>
                            </div>
                            <div id="shelf-fridge-freezer" class="grid grid-cols-2 sm:grid-cols-3 gap-2 min-h-[90px] p-1">
                                <!-- Dynamic Render -->
                            </div>
                        </div>

                    </div>

                    <!-- Fridge Bottom Info Bar -->
                    <div class="mt-4 pt-3 border-t border-slate-600/50 flex justify-between items-center text-xs text-slate-700 font-medium">
                        <span>Smart Eco Cooling</span>
                        <div class="flex gap-2">
                            <button onclick="clearExpiredIngredients()" class="px-2 py-1 bg-red-800/80 hover:bg-red-700 text-white rounded-lg text-[11px] transition">
                                <span class="inline-block mr-1">🗑️</span> 유통기한 만료 일괄 비우기
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- RIGHT PANEL: Integrated Smart Recipe Hub (7 Cols) -->
            <div class="lg:col-span-7 flex flex-col">
                <div class="bg-slate-900/90 backdrop-blur-md rounded-3xl p-5 border border-slate-800 shadow-2xl flex-grow flex flex-col">
                    
                    <!-- Recipe Filter Header -->
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 mb-4">
                        <div>
                            <h2 class="text-lg font-bold text-white flex items-center gap-2">
                                <span class="inline-block text-cyan-400">🍴</span> 보유 재료 매칭 추천 레시피
                            </h2>
                            <p class="text-xs text-slate-400">보유 재료가 <span class="text-cyan-400 font-bold">2개 이상</span> 포함된 통합 요리만 자동 노출됩니다.</p>
                        </div>
                        
                        <!-- Search & Category Filters -->
                        <div class="flex items-center gap-2 w-full sm:w-auto">
                            <div class="relative flex-grow sm:w-44">
                                <input type="text" id="recipe-search" placeholder="요리/재료 검색..." oninput="renderRecipes()" class="w-full bg-slate-800 border border-slate-700 text-xs text-slate-200 rounded-xl pl-8 pr-3 py-2 focus:outline-none focus:border-cyan-500">
                                <span class="inline-block absolute left-2.5 top-2.5 text-slate-500 text-xs">🔍</span>
                            </div>
                        </div>
                    </div>

                    <!-- Category Pills -->
                    <div class="flex gap-1.5 overflow-x-auto pb-3 mb-3 border-b border-slate-800 text-xs">
                        <button onclick="setCategory('ALL')" class="cat-btn px-3 py-1.5 rounded-xl bg-cyan-600 text-white font-medium whitespace-nowrap" data-cat="ALL">전체</button>
                        <button onclick="setCategory('한식')" class="cat-btn px-3 py-1.5 rounded-xl bg-slate-800 text-slate-300 font-medium whitespace-nowrap hover:bg-slate-700" data-cat="한식">한식</button>
                        <button onclick="setCategory('양식')" class="cat-btn px-3 py-1.5 rounded-xl bg-slate-800 text-slate-300 font-medium whitespace-nowrap hover:bg-slate-700" data-cat="양식">양식</button>
                        <button onclick="setCategory('일식')" class="cat-btn px-3 py-1.5 rounded-xl bg-slate-800 text-slate-300 font-medium whitespace-nowrap hover:bg-slate-700" data-cat="일식">일식</button>
                        <button onclick="setCategory('중식')" class="cat-btn px-3 py-1.5 rounded-xl bg-slate-800 text-slate-300 font-medium whitespace-nowrap hover:bg-slate-700" data-cat="중식">중식</button>
                        <button onclick="setCategory('디저트')" class="cat-btn px-3 py-1.5 rounded-xl bg-slate-800 text-slate-300 font-medium whitespace-nowrap hover:bg-slate-700" data-cat="디저트">간식/디저트</button>
                        <button onclick="setCategory('음료')" class="cat-btn px-3 py-1.5 rounded-xl bg-slate-800 text-slate-300 font-medium whitespace-nowrap hover:bg-slate-700" data-cat="음료">음료/카페</button>
                        <button onclick="setCategory('아시안')" class="cat-btn px-3 py-1.5 rounded-xl bg-slate-800 text-slate-300 font-medium whitespace-nowrap hover:bg-slate-700" data-cat="아시안">아시안/세계</button>
                    </div>

                    <!-- Recipe Cards Container -->
                    <div id="recipe-list" class="space-y-3 flex-grow overflow-y-auto max-h-[560px] pr-1">
                        <!-- Dynamic Render -->
                    </div>

                </div>
            </div>

        </div>
    </div>

    <!-- Floating Trash Can Visual Target -->
    <div id="trash-can" class="fixed bottom-6 right-6 w-16 h-16 bg-gradient-to-tr from-rose-600 to-red-500 rounded-full flex items-center justify-center text-white text-2xl shadow-2xl z-40 border-2 border-rose-300 transition-transform duration-300 hover:scale-110">
        <span class="inline-block ">🗑️</span>
    </div>

    <!-- Add Ingredient Modal -->
    <div id="add-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="bg-slate-900 border border-slate-700 rounded-3xl p-6 w-full max-w-md shadow-2xl transform transition-all">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-white flex items-center gap-2">
                    <span class="inline-block text-cyan-400">🛒</span> 식재료 신규 등록
                </h3>
                <button onclick="closeAddModal()" class="text-slate-400 hover:text-white text-lg"><span class="inline-block ">✕</span></button>
            </div>
            <form id="add-ingredient-form" onsubmit="handleAddIngredient(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">식재료 이름</label>
                    <input type="text" id="input-name" oninput="updateLocPreview()" required placeholder="예: 돼지고기, 김치, 양파, 대파, 계란" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-cyan-500">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1">수량 / 단위</label>
                        <input type="text" id="input-qty" required placeholder="예: 300g, 1포기, 3개" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-cyan-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1">유통기한</label>
                        <input type="date" id="input-date" onchange="updateLocPreview()" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-cyan-500">
                    </div>
                </div>
                <div class="bg-slate-800/60 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-300">
                    <span class="inline-block text-cyan-400 mr-1">✨</span> 보관 위치 자동 지정: <span id="auto-loc-preview" class="font-bold text-cyan-300">재료 이름을 입력하세요</span>
                </div>
                <div class="flex justify-end gap-2 pt-2">
                    <button type="button" onclick="closeAddModal()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold rounded-xl">취소</button>
                    <button type="submit" class="px-5 py-2 bg-cyan-600 hover:bg-cyan-500 text-white text-xs font-bold rounded-xl shadow-lg">저장하기</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // --- EMOJI MAP FOR INGREDIENTS ---
        const emojiMap = {
            "김치": "🥬", "돼지고기": "🥩", "소고기": "🥩", "닭고기": "🍗", "대파": "🧅", "양파": "🧅",
            "마늘": "🧄", "계란": "🥚", "두부": "🧊", "감자": "🥔", "당근": "🥕", "스팸": "🥫",
            "참치": "🐟", "새우": "🦐", "오징어": "🦑", "고등어": "🐟", "콩나물": "🌱", "무": "🧅",
            "청양고추": "🌶️", "고추장": "🍯", "된장": "🫘", "간장": "🍾", "식용유": "🧴", "참기름": "🍾",
            "파스타면": "🍝", "토마토": "🍅", "치즈": "🧀", "우유": "🥛", "버터": "🧈", "빵": "🍞",
            "식빵": "🍞", "베이컨": "🥓", "양송이버섯": "🍄", "표고버섯": "🍄", "팽이버섯": "🍄", "굴": "🦪",
            "밥": "🍚", "라면": "🍜", "우동면": "🍜", "소면": "🍜", "떡": "🍡", "어묵": "🍢",
            "사과": "🍎", "바나나": "🍌", "레몬": "🍋", "꿀": "🍯", "초콜릿": "🍫", "커피": "☕",
            "차": "🍵", "골뱅이": "🐚", "순대": "🌭", "족발": "🍖", "보쌈": "🥩", "가지": "🍆",
            "호박": "🎃", "애호박": "🥒", "오이": "🥒", "상추": "🥬", "깻잎": "🍃", "부추": "🌱"
        };

        function getEmoji(name) {
            for (let key in emojiMap) {
                if (name.includes(key)) return emojiMap[key];
            }
            return "🥗";
        }

        // --- INITIAL REFRIGERATOR STATE ---
        let ingredients = []; // 처음에는 빈 냉장고

        const LOC_NAME = { top: "상단 냉장실", veg: "신선 야채/신선실", freezer: "하단 냉동실" };
        function autoLocation(name, dateStr) {
            const days = dateStr ? Math.ceil((new Date(dateStr) - new Date()) / 86400000) : 0;
            if (/새우|오징어|굴|조개|바지락|연어|문어|게|고등어|참치|떡|만두|순대|족발|보쌈|얼음|아이스/.test(name)) return "freezer";
            if (/돼지|소고기|닭|베이컨|삼겹|갈비|목살/.test(name)) return days > 7 ? "freezer" : "top";
            if (/빵/.test(name)) return days > 5 ? "freezer" : "top";
            if (/김치/.test(name)) return "top";
            if (/대파|양파|마늘|당근|감자|고구마|상추|깻잎|부추|오이|가지|호박|양배추|시금치|콩나물|숙주|^무$|토마토|파프리카|피망|버섯|미나리|청경채|고사리|사과|바나나|레몬|자몽|딸기|망고|고추/.test(name)) return "veg";
            return "top";
        }
        function updateLocPreview() {
            const n = document.getElementById('input-name').value.trim();
            document.getElementById('auto-loc-preview').innerText = n ? LOC_NAME[autoLocation(n, document.getElementById('input-date').value)] : "재료 이름을 입력하세요";
        }

        function getOffsetDate(days) {
            const d = new Date();
            d.setDate(d.getDate() + days);
            return d.toISOString().split('T')[0];
        }

        let currentCategory = "ALL";

        // 200+ Completely Distinct Integrated Recipes Databank
        const recipeDatabase = [
            // --- 한식 (KOREAN) 1-50 ---
            {
                id: 1, name: "김치찌개", category: "한식",
                ingredients: ["김치", "돼지고기", "대파", "두부", "마늘"],
                details: "김치 200g, 돼지고기 150g, 대파 1/2대, 두부 1/2모, 다진마늘 1큰술, 고춧가루 1큰술, 국간장 1작은술",
                steps: [
                    "냄비에 돼지고기와 썰어둔 김치를 넣고 중간 불에서 3분간 볶아줍니다.",
                    "물 3컵(600ml)을 붓고 강불로 올린 뒤 끓기 시작하면 중약불로 줄여 10분간 폭 끓여줍니다.",
                    "두부와 다진마늘, 고춧가루, 국간장을 넣고 간을 맞춘 뒤 5분 더 끓입니다.",
                    "마지막에 어슷 썬 대파를 넣고 1분간 한소끔 더 끓여 완성합니다."
                ]
            },
            {
                id: 2, name: "된장찌개", category: "한식",
                ingredients: ["된장", "두부", "애호박", "양파", "마늘", "대파"],
                details: "된장 2큰술, 두부 1/2모, 애호박 1/3개, 양파 1/2개, 다진마늘 1/2큰술, 대파 1/2대, 멸치육수 500ml",
                steps: [
                    "멸치육수 500ml에 된장 2큰술을 체에 바쳐 고르게 풀어줍니다.",
                    "깍둑썰기한 애호박, 양파를 넣고 중불에서 5분간 끓입니다.",
                    "두부와 다진 마늘을 넣고 3분간 더 끓입니다.",
                    "송송 썬 대파를 올리고 약불에서 1분간 살짝 더 끓여 고소한 풍미를 살아나게 합니다."
                ]
            },
            {

        // --- RENDER FRIDGE INGREDIENTS WITH EXPIRATION CONTROLS ---
        function renderFridge() {
            const shelfTop = document.getElementById('shelf-fridge-top');
            const shelfVeg = document.getElementById('shelf-fridge-veg');
            const shelfFreezer = document.getElementById('shelf-fridge-freezer');

            shelfTop.innerHTML = '';
            shelfVeg.innerHTML = '';
            shelfFreezer.innerHTML = '';

            let counts = { top: 0, veg: 0, freezer: 0 };
            const today = new Date();
            today.setHours(0, 0, 0, 0);

            ingredients.forEach(item => {
                counts[item.location] = (counts[item.location] || 0) + 1;

                const expDate = new Date(item.date);
                expDate.setHours(0, 0, 0, 0);
                const diffTime = expDate - today;
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

                let dDayBadge = "";
                let isExpired = false;

                if (diffDays < 0) {
                    dDayBadge = `<span class="bg-red-500/20 text-red-400 border border-red-500/40 text-[10px] px-1.5 py-0.5 rounded-md font-bold">만료 (D+${Math.abs(diffDays)})</span>`;
                    isExpired = true;
                } else if (diffDays === 0) {
                    dDayBadge = `<span class="bg-amber-500/20 text-amber-300 border border-amber-500/40 text-[10px] px-1.5 py-0.5 rounded-md font-bold animate-pulse">D-Day</span>`;
                } else {
                    dDayBadge = `<span class="bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 text-[10px] px-1.5 py-0.5 rounded-md font-bold">D-${diffDays}</span>`;
                }

                const cardHtml = `
                    <div id="ing-card-${item.id}" class="bg-slate-800/90 border ${isExpired ? 'border-red-500/60' : 'border-slate-700'} rounded-xl p-2.5 flex flex-col justify-between shadow-md relative group transition-all duration-300 hover:scale-[1.02]">
                        <div class="flex justify-between items-start">
                            <span class="text-xl">${getEmoji(item.name)}</span>
                            <button onclick="removeIngredientWithAnim(${item.id})" class="text-slate-500 hover:text-red-400 text-xs transition">
                                <span class="inline-block ">✕</span>
                            </button>
                        </div>
                        <div class="mt-1">
                            <div class="font-bold text-xs text-slate-100 truncate">${item.name}</div>
                            <div class="text-[10px] text-slate-400 truncate">${item.qty}</div>
                        </div>
                        <div class="mt-2 flex justify-between items-center text-[10px]">
                            ${dDayBadge}
                        </div>
                    </div>
                `;

                if (item.location === 'top') shelfTop.innerHTML += cardHtml;
                else if (item.location === 'veg') shelfVeg.innerHTML += cardHtml;
                else if (item.location === 'freezer') shelfFreezer.innerHTML += cardHtml;
            });

            [[shelfTop,'top'],[shelfVeg,'veg'],[shelfFreezer,'freezer']].forEach(([el,k]) => {
                if (!counts[k]) el.innerHTML = '<div class="col-span-full text-center text-[11px] text-slate-500 py-5">비어 있음</div>';
            });
            document.getElementById('count-fridge-top').innerText = `${counts.top}개`;
            document.getElementById('count-fridge-veg').innerText = `${counts.veg}개`;
            document.getElementById('count-fridge-freezer').innerText = `${counts.freezer}개`;
            document.getElementById('stat-count').innerText = `${ingredients.length}개`;

            // Re-eval recipes when fridge updates
            renderRecipes();
        }

        // --- ANIMATED REMOVAL INTO TRASH ---
        function removeIngredientWithAnim(id) {
            const el = document.getElementById(`ing-card-${id}`);
            if (el) {
                el.classList.add('trash-animation');
                setTimeout(() => {
                    ingredients = ingredients.filter(i => i.id !== id);
                    renderFridge();
                }, 650);
            }
        }

        function clearExpiredIngredients() {
            const today = new Date();
            today.setHours(0,0,0,0);

            const expiredIds = ingredients.filter(item => {
                const d = new Date(item.date);
                d.setHours(0,0,0,0);
                return d < today;
            }).map(i => i.id);

            if (expiredIds.length === 0) {
                alert("유통기한이 지난 식재료가 없습니다!");
                return;
            }

            expiredIds.forEach(id => {
                const el = document.getElementById(`ing-card-${id}`);
                if (el) el.classList.add('trash-animation');
            });

            setTimeout(() => {
                ingredients = ingredients.filter(item => !expiredIds.includes(item.id));
                renderFridge();
            }, 650);
        }

        // --- MATCH & RENDER RECIPES ---

            const container = document.getElementById('recipe-list');
            const searchKeyword = document.getElementById('recipe-search').value.trim().toLowerCase();

            // Extract set of user ingredient names
            const myIngredientNames = ingredients.map(i => i.name.toLowerCase());

            // Filter recipes
            let matchedRecipes = recipeDatabase.map(recipe => {
                // Find matching ingredients
                const matched = recipe.ingredients.filter(ing => 
                    myIngredientNames.some(myIng => myIng.includes(ing.toLowerCase()) || ing.toLowerCase().includes(myIng))
                );
                const missing = recipe.ingredients.filter(ing => !matched.includes(ing));

                return {
                    ...recipe,
                    matchedCount: matched.length,
                    matchedList: matched,
                    missingList: missing
                };
            }).filter(recipe => {
                // RULE 1: At least 2 matching ingredients required
                const meetsMatchingRule = recipe.matchedCount >= 2;
                // RULE 2: Category filter
                const meetsCat = (currentCategory === "ALL" || recipe.category === currentCategory);
                // RULE 3: Search filter
                const meetsSearch = !searchKeyword || recipe.name.toLowerCase().includes(searchKeyword) || recipe.ingredients.some(i => i.toLowerCase().includes(searchKeyword));

                return meetsMatchingRule && meetsCat && meetsSearch;
            });

                            <div class="grid grid-cols-2 gap-2 text-xs text-slate-300">
                                ${shoppingRecommendations.map(item => `
                                    <label class="flex items-center space-x-2 bg-slate-800 p-2 rounded-lg cursor-pointer hover:bg-slate-750">
                                        <input type="checkbox" class="rounded text-cyan-500 focus:ring-0">
                                        <span>${getEmoji(item)} ${item}</span>
                                    </label>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                `;
                return;
            }

            // RENDER MATCHED RECIPES WITH ACCORDION DETAILS
            matchedRecipes.forEach(recipe => {
                const card = document.createElement('div');
                card.className = "bg-slate-800/80 border border-slate-700/80 rounded-2xl p-4 transition-all duration-200 hover:border-cyan-500/50";
                
                card.innerHTML = `
                    <div class="flex justify-between items-start cursor-pointer" onclick="toggleRecipeDetails(${recipe.id})">
                        <div class="flex items-center space-x-3">
                            <div class="w-10 h-10 rounded-xl bg-slate-700 flex items-center justify-center text-xl shadow-inner">
                                ${getEmoji(recipe.ingredients[0] || "요리")}
                            </div>
                            <div>
                                <div class="flex items-center gap-2">
                                    <h3 class="font-bold text-sm text-white">${recipe.name}</h3>
                                    <span class="text-[10px] px-2 py-0.5 rounded-full bg-slate-700 text-slate-300 font-medium">${recipe.category}</span>
                                </div>
                                <div class="text-xs text-slate-400 mt-0.5">
                                    일치 재료 <span class="text-emerald-400 font-bold">${recipe.matchedCount}개</span> (${recipe.matchedList.join(', ')})
                                </div>
                            </div>
                        </div>
                        <div class="flex items-center space-x-2">
                            <span class="text-xs text-cyan-400 font-medium">상세 조리법</span>
                            <span id="arrow-${recipe.id}" class="inline-block text-slate-400 text-xs transition-transform duration-200">▾</span>
                        </div>
                    </div>

                    <!-- Accordion Collapsible Detail Section -->
                    <div id="detail-${recipe.id}" class="hidden mt-4 pt-3 border-t border-slate-700/60 text-xs space-y-3">
                        <div class="bg-slate-900/60 p-3 rounded-xl border border-slate-800">
                            <div class="font-bold text-cyan-300 mb-1"><span class="inline-block mr-1">⚖️</span> 정확한 계량/재료:</div>
                            <p class="text-slate-300 leading-relaxed">${recipe.details}</p>
                            ${recipe.missingList.length > 0 ? `
                                <div class="mt-2 text-[11px] text-amber-400/90">
                                    <span class="inline-block mr-1">⚠️</span> 부족한 재료: ${recipe.missingList.join(', ')}
                                </div>
                            ` : ''}
                        </div>

                        <div>
                            <div class="font-bold text-emerald-300 mb-2"><span class="inline-block mr-1">🔥</span> 단계별 조리 가이드:</div>
                            <ol class="space-y-2 text-slate-300">
                                ${recipe.steps.map((step, idx) => `
                                    <li class="flex items-start gap-2 bg-slate-900/40 p-2 rounded-lg">
                                        <span class="bg-cyan-500/20 text-cyan-300 rounded-md px-1.5 py-0.5 text-[10px] font-bold shrink-0">${idx + 1}단계</span>
                                        <span class="leading-relaxed">${step}</span>
                                    </li>
                                `).join('')}
                            </ol>
                        </div>
                    </div>
                `;

                container.appendChild(card);
            });
        }

        function toggleRecipeDetails(id) {
            const detail = document.getElementById(`detail-${id}`);
            const arrow = document.getElementById(`arrow-${id}`);
            if (detail.classList.contains('hidden')) {
                detail.classList.remove('hidden');
                arrow.style.transform = 'rotate(180deg)';
            } else {
                detail.classList.add('hidden');
                arrow.style.transform = 'rotate(0deg)';
            }
        }

        // --- MODAL CONTROLS ---
        function openAddModal() {
            document.getElementById('add-modal').classList.remove('hidden');
            // Default date set to +7 days
            document.getElementById('input-date').value = getOffsetDate(7);
        }

        function closeAddModal() {
            document.getElementById('add-modal').classList.add('hidden');
        }

        function handleAddIngredient(e) {
            e.preventDefault();
            const name = document.getElementById('input-name').value.trim();
            const qty = document.getElementById('input-qty').value.trim();
            const date = document.getElementById('input-date').value;
            const location = autoLocation(name, date);

            if (!name) return;

            const newIng = {
                id: Date.now(),
                name: name,
                qty: qty,
                date: date,
                location: location
            };

            ingredients.push(newIng);
            closeAddModal();
            document.getElementById('add-ingredient-form').reset();
            document.getElementById('auto-loc-preview').innerText = '재료 이름을 입력하세요';
            renderFridge();
        }
    </script>
</body>
</html>
